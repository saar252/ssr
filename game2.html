<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tebak Suara Binatang</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: #f4e1d2;
    }

    h1 {
      margin-top: 50px;
      color: #ff6f61;
      font-size: 40px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .button-container {
      margin-top: 30px;
    }

    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 15px;
      border: none;
      background-color: #ffb347;
      color: white;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease, transform 0.2s;
    }

    button:hover {
      background-color: #ff9f00;
      transform: scale(1.1);
    }

    #result {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      transition: opacity 0.5s ease;
    }

    #result.green {
      color: green;
      opacity: 1;
    }

    #result.red {
      color: red;
      opacity: 1;
    }

    #result.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <h1>🦁 Tebak Suara Binatang</h1>

  <button onclick="playAnimal()">🔊 Mainkan Suara</button>

  <div class="button-container">
    <button onclick="checkAnimal('kucing')">Kucing</button>
    <button onclick="checkAnimal('anjing')">Anjing</button>
    <button onclick="checkAnimal('sapi')">Sapi</button>
  </div>

  <p id="result" class="hidden"></p>

  <!-- Audio suara hewan -->
  <audio id="animal-audio" src="" controls></audio>
  <!-- Audio jawaban benar dan salah -->
  <audio id="benar-audio" src="benar.mp3"></audio>
  <audio id="salah-audio" src="salah.mp3"></audio>

  <script>
    let currentAnimal = '';

    function playAnimal() {
      const animals = ['kucing', 'anjing', 'sapi'];
      currentAnimal = animals[Math.floor(Math.random() * animals.length)];

      const audio = document.getElementById('animal-audio');
      const sounds = {
        kucing: 'suara-kucing.mp3',
        anjing: 'suara-anjing.mp3',
        sapi: 'suara-sapi.mp3'
      };

      audio.src = sounds[currentAnimal];
      audio.play();

      document.getElementById('result').textContent = '';
      document.getElementById('result').className = 'hidden';
    }

    function checkAnimal(ans) {
      const result = document.getElementById('result');
      const benarAudio = document.getElementById('benar-audio');
      const salahAudio = document.getElementById('salah-audio');

      if (ans === currentAnimal) {
        result.textContent = 'Benar! 🎉';
        result.className = 'green';
        benarAudio.play();
      } else {
        result.textContent = 'Coba lagi 😅';
        result.className = 'red';
        salahAudio.play();
      }
    }
  </script>

</body>
</html>
